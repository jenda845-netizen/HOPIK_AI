<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blahovec AI Agency Elite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #020617; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.8); border: 1px solid #1e293b; border-radius: 20px; box-shadow: 0 0 40px rgba(37, 99, 235, 0.1); }
        .btn-check:checked + div { background: #2563eb; border-color: #60a5fa; box-shadow: 0 0 15px rgba(37, 99, 235, 0.4); }
    </style>
</head>
<body class="p-4 sm:p-8">
    <div class="max-w-4xl mx-auto">
        <header class="text-center mb-10">
            <div class="inline-block px-3 py-1 rounded-full border border-blue-500/30 bg-blue-500/10 text-blue-400 text-[10px] font-bold uppercase tracking-widest mb-4">
                Powered by GPT-4o-mini
            </div>
            <h1 class="text-6xl font-black tracking-tighter text-white mb-2 italic">BLAHOVEC<span class="text-blue-600">.AI</span></h1>
            <p class="text-slate-500 text-sm">Váš privátní asistent pro digitální dominanci</p>
        </header>

        <div class="glass p-6 sm:p-10">
            <form action="/generovat" method="POST" class="space-y-8">
                <div>
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-4 text-center">Vyberte specializaci</label>
                    <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
                        <label class="relative cursor-pointer">
                            <input type="radio" name="sluzba" value="recenze" class="hidden btn-check" checked>
                            <div class="p-3 text-center rounded-xl border border-slate-800 text-xs font-bold transition-all hover:border-slate-600">Odpovědi na Recenze</div>
                        </label>
                        <label class="relative cursor-pointer">
                            <input type="radio" name="sluzba" value="popisky" class="hidden btn-check">
                            <div class="p-3 text-center rounded-xl border border-slate-800 text-xs font-bold transition-all hover:border-slate-600">E-shop Copywriting</div>
                        </label>
                        <label class="relative cursor-pointer">
                            <input type="radio" name="sluzba" value="social" class="hidden btn-check">
                            <div class="p-3 text-center rounded-xl border border-slate-800 text-xs font-bold transition-all hover:border-slate-600">Sítě & Reels Scénáře</div>
                        </label>
                        <label class="relative cursor-pointer">
                            <input type="radio" name="sluzba" value="recepty" class="hidden btn-check">
                            <div class="p-3 text-center rounded-xl border border-slate-800 text-xs font-bold transition-all hover:border-slate-600">Gastro Kalkulace</div>
                        </label>
                        <label class="relative cursor-pointer">
                            <input type="radio" name="sluzba" value="prodej" class="hidden btn-check">
                            <div class="p-3 text-center rounded-xl border border-slate-800 text-xs font-bold transition-all hover:border-slate-600">Prodejní (Cold) E-maily</div>
                        </label>
                        <label class="relative cursor-pointer">
                            <input type="radio" name="sluzba" value="reklama" class="hidden btn-check">
                            <div class="p-3 text-center rounded-xl border border-slate-800 text-xs font-bold transition-all hover:border-slate-600">FB / Google Reklamy</div>
                        </label>
                    </div>
                </div>

                <div>
                    <textarea name="vstup" rows="4" class="w-full p-5 rounded-2xl bg-slate-950 border border-slate-800 text-white focus:ring-2 focus:ring-blue-600 focus:outline-none placeholder:text-slate-700 text-sm" placeholder="Zadejte název produktu, firmy nebo jídla..."></textarea>
                </div>
                
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-5 rounded-2xl shadow-2xl transition-all active:scale-95 uppercase tracking-widest text-sm">
                    Vygenerovat Strategii ✨
                </button>
            </form>
        </div>

        {% if odpoved %}
        <div class="mt-8 glass p-8 border-t-4 border-blue-600">
            <div class="flex justify-between items-center mb-4">
                <span class="text-[10px] font-bold text-blue-500 uppercase tracking-widest">Výstup systému</span>
                <button onclick="navigator.clipboard.writeText(`{{ odpoved }}`)" class="text-[10px] bg-slate-800 px-3 py-1 rounded hover:bg-slate-700">Kopírovat vše</button>
            </div>
            <div class="text-slate-200 text-sm leading-relaxed whitespace-pre-wrap">{{ odpoved }}</div>
        </div>
        {% endif %}
    </div>
</body>
</html>
